[project]
name = "ai-music-coach-api"
version = "0.1.0"
description = "Python FastAPI server for AI Music Coach"
requires-python = ">=3.10"

dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "pymupdf",
    "opencv-python-headless",
    "pillow",
    "numpy",
    "music21",
    "supabase",
    "python-multipart",
    "anthropic",
    # LangGraph only — deliberately NOT langchain-anthropic. Nodes call the
    # Anthropic SDK directly to keep adaptive thinking, effort, cache_control
    # and strict tools, none of which survive a LangChain model wrapper.
    # No checkpoint backend: resume was never wired up (see graph/build.py).
    "langgraph",
]

[tool.setuptools]
packages = ["app", "app.graph"]