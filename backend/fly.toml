# Fly.io config for the FastAPI backend.
# Deploy from this directory (backend/) so the build context matches the
# Dockerfile's COPY paths:  cd backend && fly deploy
#
# App name must be globally unique — change it if `fly apps create` reports a
# collision, and keep it in sync with the Vercel NEXT_PUBLIC_BACKEND_URL.
app = "ai-music-coach-api"
primary_region = "iad" # US East; pick the region closest to your Supabase project

[build]
  dockerfile = "Dockerfile"

[env]
  # The Dockerfile's CMD listens on $PORT; keep this aligned with internal_port.
  PORT = "8000"

[http_service]
  internal_port = 8000
  force_https = true
  # Audiveris processing is fire-and-forget (FastAPI BackgroundTasks), so the
  # machine must stay alive after the HTTP response returns — do NOT auto-stop,
  # or an in-flight conversion could be killed when traffic goes idle.
  auto_stop_machines = "off"
  auto_start_machines = false
  min_machines_running = 1

  [[http_service.checks]]
    interval = "30s"
    timeout = "5s"
    grace_period = "20s"
    method = "GET"
    path = "/"

[[vm]]
  size = "shared-cpu-1x"
  memory = "2gb" # bump to "4gb" (or `fly scale memory 4096`) if Audiveris still OOMs on large scores
