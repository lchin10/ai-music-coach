# Render Blueprint — deploys the FastAPI backend as a Docker web service.
# The Next.js frontend is deployed separately on Vercel (root dir: frontend/).
# Docs: https://render.com/docs/blueprint-spec
services:
  - type: web
    name: ai-music-coach-api
    runtime: docker
    repo: https://github.com/lukaschin/ai-music-coach # update to your repo URL
    plan: standard # Audiveris + music21 + opencv need more than the free 512MB
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    healthCheckPath: /
    autoDeploy: true
    envVars:
      # AUDIVERIS_PATH is baked into the image (Dockerfile ENV); no need to set here.
      - key: NEXT_PUBLIC_SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: DATABASE_URL
        sync: false
      # Set to the Vercel production URL after the frontend is deployed (drives CORS).
      - key: FRONTEND_URL
        sync: false
